# Docker Compose configuration for local development.
# Use docker-compose.yml for deploy in Coolify/Cloudflare.

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: alltura_postgres_dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-alltura_reports}
    ports:
      - "${DB_PORT:-5432}:5432"
    expose:
      - "5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./db/init/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-alltura_reports} -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - alltura_dev_network

  redis:
    image: redis:7-alpine
    container_name: alltura_redis_dev
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - alltura_dev_network

networks:
  alltura_dev_network:
    driver: bridge

volumes:
  redis_data:
    driver: local
